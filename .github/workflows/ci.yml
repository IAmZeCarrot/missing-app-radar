name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - name: Verify deterministic cluster build
        env:
          RADAR_GENERATED_AT: '2026-01-01T00:00:00.000Z'
        run: npm run cluster
